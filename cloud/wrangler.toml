name = "templearn-cloud"
main = "src/index.ts"
compatibility_date = "2026-11-02"
workers_dev = true

[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "templearn-forecasts"
database_id = "f6af2944-b2b9-43d0-ab87-886cacc632b8"
migrations_dir = "migrations"

# Non-secret deployment configuration. Keep SYNC_KEY out of vars and source control.
# Configure it separately with: npx wrangler secret put SYNC_KEY
[vars]
LOCATION_ID = "mount-boyce-au"
LATITUDE = "-33.6153"
LONGITUDE = "150.2665"
TIMEZONE = "Australia/Sydney"

# Historical training is CPU-intensive; requires a Workers Paid plan.
[limits]
cpu_ms = 300000
